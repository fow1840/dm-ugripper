interface:
  display_name: "Episode Validator"
  short_description: "深度校验 episode，列出全模态起止偏移与 gap 表"
  default_prompt: "使用 $validate-episode-data 校验这条新录制的 episode；如果我说“校验最新一条数据”，默认对给定数据父目录执行 --latest，输出所有模态（含视频、音频、sensor 和 Fays）的起始/结束相对偏移 ms 表与 gap 简表，注明基准、阈值、时间映射或平滑限制，并保留已有文件、schema、标定、首帧、同步、覆盖与尾部校验。"
